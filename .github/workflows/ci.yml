name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Redis.Client.Tests -c Release --no-build --logger trx --results-directory TestResults
      - name: Pack
        run: dotnet pack src/Redis.Client -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            artifacts
            TestResults

  integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["redis:6.2-alpine", "redis:7.4-alpine"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integration tests (${{ matrix.redis }})
        env:
          REDIS_IMAGE: ${{ matrix.redis }}
        run: dotnet test tests/Redis.Client.IntegrationTests -c Release --logger trx --results-directory TestResults

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish with NativeAOT
        run: dotnet publish tests/Redis.Client.AotSmoke -c Release -o aot-out
      - run: ./aot-out/Redis.Client.AotSmoke
